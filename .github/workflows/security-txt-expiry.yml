name: Check security.txt expiry

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  pull_request:
    paths:
      - .well-known/security.txt
      - .github/workflows/security-txt-expiry.yml
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check expiry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fail if security.txt expires within 4 weeks
        run: |
          expires=$(grep -i '^Expires:' .well-known/security.txt | head -1 \
            | sed 's/^[Ee]xpires:[[:space:]]*//')
          exp=$(date -u -d "$expires" +%s)
          limit=$(( $(date -u +%s) + 4*7*24*3600 ))
          if [ "$exp" -lt "$limit" ]; then
            echo "::error::security.txt expires in less than 4 weeks (at $expires). Run scripts/update-security-txt.sh locally, commit, and push."
            exit 1
          fi
          echo "OK: security.txt expires in more than 4 weeks (at $expires)"
